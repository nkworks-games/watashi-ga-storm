<style>

#tip{position:absolute;left:0;right:0;bottom:44px;text-align:center;opacity:0;transition:opacity .25s}#tip.on{opacity:1}
#tip span{display:inline-block;padding:5px 13px;border-radius:14px;background:rgba(30,18,56,.82);border:1.5px solid rgba(255,255,255,.55);font-size:13px}
#banner{position:absolute;left:0;right:0;top:25%;text-align:center;font-family:var(--dela);font-weight:400;font-size:34px;line-height:1.25;-webkit-text-stroke:7px var(--ink);paint-order:stroke fill;opacity:0}
#banner small{display:block;font-size:17px;-webkit-text-stroke:5px var(--ink)}#banner em{font-style:normal;color:var(--yel)}#banner.cap{top:auto;bottom:92px;font-size:25px;-webkit-text-stroke:6px var(--ink)}
#banner.go{animation:bn 1.25s ease-out forwards}#banner.stay{animation:bn2 .4s ease-out forwards}

#mute svg{width:17px;height:17px;display:block;margin:auto}#mute .x{display:none}#mute.off .x{display:block}#mute.off .w{display:none}

#title:before{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(36,16,84,.9) 0,rgba(36,16,84,.55) 28%,rgba(36,16,84,.12) 46%,rgba(36,16,84,.55) 66%,rgba(36,16,84,.92) 100%)}
#logo{position:absolute;left:0;right:0;top:34px;margin:0;text-align:center;font-family:var(--dela);font-weight:400;line-height:1;transform:rotate(-4deg)}
#logo span{display:block;-webkit-text-stroke:8px var(--ink);paint-order:stroke fill}
#logo .a{font-size:27px;letter-spacing:.06em;margin-right:118px}
#logo .b{font-size:70px;color:var(--yel);letter-spacing:-.01em;margin-top:4px;-webkit-text-stroke:11px var(--ink);filter:drop-shadow(0 5px 0 var(--pur))}
#logo .c{font-size:32px;margin:10px 0 0 190px}
#logo svg{position:absolute;right:38px;top:-12px;width:46px;height:64px;transform:rotate(14deg);filter:drop-shadow(0 3px 0 var(--ink))}
#lead{position:absolute;left:0;right:0;top:206px;text-align:center;font-size:14.5px;font-weight:900;letter-spacing:.04em;text-shadow:0 2px 0 var(--ink),0 0 8px rgba(30,15,60,.9)}
#how{position:absolute;left:16px;right:16px;bottom:124px;padding:10px 12px 9px;background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:16px;box-shadow:0 5px 0 var(--ink);font-size:12.5px;line-height:1.5}
#how p{margin:0 0 5px;padding-left:25px;position:relative}#how p:last-child{margin:0}
#how i{position:absolute;left:0;top:1px;width:19px;height:19px;border-radius:50%;background:var(--pur);color:#fff;font-style:normal;font-family:var(--dela);font-weight:400;font-size:11px;line-height:19px;text-align:center}
#how b{color:var(--pur);font-weight:900}#how small{display:block;font-size:10.5px;font-weight:800;color:#6a5f80}
.btn{display:block;box-sizing:border-box;border:3px solid var(--ink);border-radius:18px;box-shadow:0 5px 0 var(--ink);font-family:var(--dela)!important;font-weight:400;color:var(--ink);text-align:center}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
#go{position:absolute;left:58px;right:58px;bottom:54px;height:54px;background:var(--yel);font-size:25px;letter-spacing:.08em;animation:pl 1.1s ease-in-out infinite}

#best0{position:absolute;left:0;right:0;bottom:29px;text-align:center;font-size:12.5px;color:var(--yel);text-shadow:0 1px 0 var(--ink),0 0 6px rgba(30,15,60,.9)}

  </div>
</div>
